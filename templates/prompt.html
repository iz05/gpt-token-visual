<!-- templates/prompt.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Input Prompt</title>
</head>
<body>
    <h1>Enter your prompt:</h1>
    <form method="POST" action="/">
        <input type="text" name="prompt_text" size="50" required>
        <br><br>
        <button type="submit" name="action" value="submit">Submit</button>
        <button type="submit" name="action" value="use_preload">Use Preload Prompt</button>
    </form>
</body>
</html>
